<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- nome da pagina -->
  <title>{% block titulo %}Sistema de Cadastro{% endblock %}</title>
      <!-- fontes do logo: Poppins (textos) e Kaushan Script ("Quilombo") -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>

  <header>
    

    <!-- titulo dentro da pagina -->
        <!-- logo + "Quilombo Doces" + nome da area -->
    <h1>
      <a class="logo" href="{{ url_for('listar') }}">
        <img class="logo-img" src="{{ url_for('static', filename='img/logo.png') }}" alt="">
        <span class="logo-texto">
          <span class="logo-nome">Quilombo</span>
          <span class="logo-sub">Doces</span>
        </span>
        <span class="logo-area">Sistema de Cadastro</span>
      </a>
    </h1>
        <nav>
      <!-- opcoes para clicar na parte de cima da pagina -->
      <a href="{{ url_for('listar') }}">Lista</a>
      <a href="{{ url_for('buscar') }}">Buscar</a>
      <a href="{{ url_for('eventos') }}">Eventos</a>
      <a href="{{ url_for('carrossel') }}">Carrossel</a>
      <a href="{{ url_for('sobre') }}">Sobre</a>
            <!-- Pedidos: o numero mostra quantos clientes avisaram que pagaram -->
      <a href="{{ url_for('pedidos') }}">Pedidos{% if pedidos_pendentes %} <span class="contador-pedidos">{{ pedidos_pendentes }}</span>{% endif %}</a>
      <!-- botao que leva para a loja (so existe aqui, na area do administrador) -->
      <a class="botao-loja" href="{{ url_for('loja') }}">Ir para a loja &rarr;</a>
    </nav>
  </header>

  <main>
    {% block conteudo %}{% endblock %}
  </main>

  <footer>
    <!-- rodape -->
    Quilombo Doces
  </footer>

</body>
</html>
