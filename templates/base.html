<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <!-- nome da pagina -->
  <title>{% block titulo %}Sistema de Cadastro{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>

  <header>
    <!-- titulo dentro da pagina -->
    <h1>Sistema de Cadastro</h1>
    <nav>
      <!-- opcoes para clicar na parte de cima da pagina -->
      <a href="{{ url_for('listar') }}">Lista</a>
      <a href="{{ url_for('buscar') }}">Buscar</a>
      <a href="{{ url_for('eventos') }}">Eventos</a>
    </nav>
  </header>

  <main>
    {% block conteudo %}{% endblock %}
  </main>

  <footer>
    <!-- rodape -->
    Quilombo Doces
  </footer>

</body>
</html>
